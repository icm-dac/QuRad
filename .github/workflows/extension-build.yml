name: Build QuRad extension

on:
  push:
    branches: [ "main" ]
    paths: [ "extension/**", ".github/workflows/extension-build.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "extension/**", ".github/workflows/extension-build.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
      - name: Upload extension jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qupath-extension-qurad
          path: extension/build/libs/*.jar
          if-no-files-found: warn
